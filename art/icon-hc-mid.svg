    <path d="M459.09,131.66 L512,76 L512,126 Z" fill="#4A4038"/>
    <path d="M564.91,131.66 L512,76 L512,126 Z" fill="#241C14"/>
    <path d="M656.35,156.16 L730,134.41 L705,177.71 Z" fill="#4A4038"/>
    <path d="M747.99,209.07 L730,134.41 L705,177.71 Z" fill="#241C14"/>
    <path d="M814.93,276.01 L889.59,294 L846.29,319 Z" fill="#4A4038"/>
    <path d="M867.84,367.65 L889.59,294 L846.29,319 Z" fill="#241C14"/>
  </g>

    <path d="M512,279.50 L711.95,512 L512,744.50 L312.05,512 Z" fill="#E4CB94"/><path d="M501.54,360.87 L649.50,532.92 L501.54,704.97 L353.57,532.92 Z" fill="#B79355"/><path d="M491.07,442.25 L587.05,553.85 L491.07,665.45 L395.10,553.85 Z" fill="#E4CB94"/><path d="M480.61,523.62 L524.60,574.77 L480.61,625.92 L436.62,574.77 Z" fill="#B79355"/><circle cx="512" cy="512" r="27.90" fill="#C9848C"/>
  </g>

  <g transform="translate(512.0 720.0)">
    <path d="M0,-26 L18,0 L0,26 L-18,0 Z" fill="url(#brass)"/>
    <path d="M-34,0 L-58,-12 M34,0 L58,-12" stroke="#B79355" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#C9848C" fill-opacity="0.9"/>
  </g>
</svg>
