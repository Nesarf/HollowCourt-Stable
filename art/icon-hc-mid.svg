    <polygon points="253.92,699.50 193.03,507.99 233.02,508.49 286.28,675.99" fill="#7B76B4"/>
    <polygon points="193,512 256.30,321.27 288.36,345.18 233,512" fill="#E4C271"/>
    <polygon points="253.92,324.50 417.24,207.40 429.13,245.59 286.28,348.01" fill="#D99A63"/>
    <polygon points="413.42,208.61 614.38,209.88 601.54,247.76 425.78,246.66" fill="#CE7A82"/>
    <polygon points="610.58,208.61 772.41,327.75 739.76,350.86 598.22,246.66" fill="#A96E9E"/>
    <polygon points="770.08,324.50 830.97,516.01 790.98,515.51 737.72,348.01" fill="#7B76B4"/>
    <circle cx="512.0" cy="512.0" r="344" fill="none" stroke="#EDE4D8" stroke-width="13"/>
    <circle cx="512.0" cy="512.0" r="344" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.65"/>
    <path d="M892.34,459.09 L948,512 L898,512 Z" fill="#4A4038"/>
    <path d="M892.34,564.91 L948,512 L898,512 Z" fill="#241C14"/>
