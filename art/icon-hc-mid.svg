    <path d="M656.35,867.84 L730,889.59 L705,846.29 Z" fill="#241C14"/>
    <path d="M564.91,892.34 L512,948 L512,898 Z" fill="#4A4038"/>
    <path d="M459.09,892.34 L512,948 L512,898 Z" fill="#241C14"/>
    <path d="M367.65,867.84 L294,889.59 L319,846.29 Z" fill="#4A4038"/>
    <path d="M276.01,814.93 L294,889.59 L319,846.29 Z" fill="#241C14"/>
    <path d="M209.07,747.99 L134.41,730 L177.71,705 Z" fill="#4A4038"/>
