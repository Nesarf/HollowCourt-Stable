      - name: flutter test / ui/firewall_row_test.dart
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/ui/firewall_row_test.dart
      - name: flutter test / ui/japanese_review_test.dart
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/ui/japanese_review_test.dart
      - name: flutter test / ui/link_row_test.dart
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/ui/link_row_test.dart
      - name: flutter test / ui/locale_defaults_test.dart
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
