        run: flutter test test/p3_acceptance_test.dart
      - name: flutter test / widget_test.dart
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/widget_test.dart

      # **And a guard, so that a directory added later is not quietly unchecked.** Splitting a suite into steps trades one
      # problem for another: the steps have to keep covering everything. This says so out loud.
      - name: every test file is run by one of the steps above
        if: ${{ hashFiles('pubspec.yaml') != '' }}
        run: |
          missed=0
          for file in $(find test -name '*_test.dart' | sort); do
            case "$file" in
              test/adapters/*|test/data/*|test/domain/*|test/tooling/*|test/ui/*|test/*_test.dart) ;;
              *) echo "没有步骤跑它：$file"; missed=1 ;;
            esac
          done
          if [ "$missed" = "1" ]; then
            echo "above is every test file that no step runs -- add a step for it."
            exit 1
          fi
          echo "全部 %s 个测试文件都有步骤在跑" "$(find test -name '*_test.dart' | wc -l)"

      # And it says so, rather than passing quietly on a branch where it did nothing at all.
      - name: nothing to verify here
        if: ${{ hashFiles('pubspec.yaml') == '' }}
        run: echo "this branch carries the platform, not the product -- the HMA job above is the one that matters"
