name: verify

# **One pipeline, not two.** The steps live in `tool/hma_verify.py` and this file calls it, because a pipeline written
# twice -- once in YAML for the server and once in a shell history for the developer -- is two pipelines, and the one that
# runs is whichever was written last.
#
# **It did not run for thirteen pushes.** A job-level `if` on the product job -- evaluated before that job exists -- took
# the workflow's other jobs with it rather than skipping one. A one-job probe settled that the repository was fine.
#
# **And a GitHub Actions log for a public repository cannot be read without a token, while a step name can.** That is why
# the HMA side is split by stage and the product side by test directory: a red step has to say what broke by itself.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hma:
    name: HMA tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install what the renderer needs
        run: python -m pip install --quiet pillow

      # One step per stage, so a failure names the stage rather than the whole pipeline.
      - name: stage / syntax
        run: python tool/hma_verify.py --stage syntax
      - name: stage / tests
        run: python tool/hma_verify.py --stage tests
      - name: stage / art
        run: python tool/hma_verify.py --stage art
      - name: stage / render
        run: python tool/hma_verify.py --stage render
        env:
          # The renderer writes beside the sources by default and Unity is not here, so it is pointed at a temporary
          # directory -- the same variable a developer would set.
          HMA_TMP: ${{ runner.temp }}

  product:
    name: the product
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # **Only where the product exists.** `main` has it; the HMA branch deliberately carries the platform instead. The
      # condition is on each step rather than on the job, and that is the fix rather than a preference.
      - if: ${{ hashFiles('pubspec.yaml') != '' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: flutter pub get
        if: ${{ hashFiles('pubspec.yaml') != '' }}
        run: flutter pub get
      - name: flutter analyze
        if: ${{ hashFiles('pubspec.yaml') != '' }}
        run: flutter analyze

      # **One step per test file under `data`, one per directory elsewhere, and every step runs even if an earlier
      # one failed.** Both halves are about the same thing: a failure here cannot be read from outside, so one failure
      # must not cost the information from the steps after it, and the failing step has to name the file.
      #
      # `data` is split by file because it is where the suite first went red, and because seven of its seventeen files
      # touch a socket, a proxy or a firewall -- the parts of a test suite most likely to be about the machine it runs on.
      # **By directory rather than by file, and that is the correction.** The list this replaces named 65 files:
      # two of them had been renamed and left the pipeline red for two pushes, and 85 files that exist had never been
      # run by any step at all -- because the check that was supposed to catch that one compared *directories*, so it
      # passed while doing nothing.
      #
      # A directory cannot be renamed out from under a step, and a file added inside one is covered the day it lands.
      # What is lost is a step name that says which file broke; what is kept is a pipeline that is right about what it
      # covers, which is the property worth having.
      - name: flutter test / adapters
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/adapters
      - name: flutter test / data
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/data
      - name: flutter test / domain
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/domain
      - name: flutter test / tooling
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/tooling
      - name: flutter test / ui
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/ui
      - name: flutter test / p1_acceptance_test.dart
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/p1_acceptance_test.dart
      - name: flutter test / p3_acceptance_test.dart
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/p3_acceptance_test.dart
      - name: flutter test / widget_test.dart
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/widget_test.dart

      # **Two checks, and the second is the one that would have caught the red pipeline.**
      #
      # The first asks that every test file on disk sits inside a path some step runs. The second asks that every path
      # a step runs actually exists -- which is what the old check could not do, and why a renamed file could leave two
      # pushes red while the coverage check reported success.
      #
      # `flutter[ ]test` rather than `flutter test` in the pattern, so this line does not match itself.
      - name: every test file is covered, and every step points at something
        if: ${{ hashFiles('pubspec.yaml') != '' }}
        run: |
          listed=$(grep -oE 'run: flutter[ ]test .*' .github/workflows/verify.yml | sed 's/run: flutter[ ]test //' | xargs -n1 | sort -u)
          missed=0
          for path in $listed; do
            if [ ! -e "$path" ]; then
              echo "一条步骤指向不存在的路径：$path"
              missed=1
            fi
          done
          for file in $(find test -name '*_test.dart' | sort); do
            covered=0
            for path in $listed; do
              case "$file" in "$path"*) covered=1 ;; esac
            done
            if [ "$covered" = "0" ]; then
              echo "没有步骤跑它：$file"
              missed=1
            fi
          done
          if [ "$missed" = "1" ]; then exit 1; fi
          echo "全部 $(find test -name '*_test.dart' | wc -l) 个测试文件都有步骤覆盖，且每条步骤的路径都存在"

      # And it says so, rather than passing quietly on a branch where it did nothing at all.
      - name: nothing to verify here
        if: ${{ hashFiles('pubspec.yaml') == '' }}
        run: echo "this branch carries the platform, not the product -- the HMA job above is the one that matters"
