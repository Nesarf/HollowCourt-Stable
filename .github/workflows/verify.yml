      - name: flutter test / sync\adb_carrier_test.dart
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/data/sync/adb_carrier_test.dart
      - name: flutter test / sync\courtpack_service_test.dart
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/data/sync/courtpack_service_test.dart
      - name: flutter test / sync\discovery_socket_test.dart
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/data/sync/discovery_socket_test.dart
      - name: flutter test / sync\firewall_probe_test.dart
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/data/sync/firewall_probe_test.dart
      - name: flutter test / sync\no_proxy_test.dart
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/data/sync/no_proxy_test.dart
      - name: flutter test / sync\socket_transport_test.dart
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/data/sync/socket_transport_test.dart
      - name: flutter test / sync\sync_verbs_test.dart
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/data/sync/sync_verbs_test.dart
      - name: flutter test / domain
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/domain
      - name: flutter test / tooling
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/tooling
      # **ui and the root, one step per file**, for the same reason `data` is: a red step has to name the file it
      # was that failed. Generated from the listing with forward slashes -- the first generator used
      # `os.path.join` on Windows and produced fourteen steps naming files Linux has never heard of.
      - name: flutter test / ui/adapters_section_test.dart
        if: ${{ !cancelled() && hashFiles('pubspec.yaml') != '' }}
        run: flutter test test/ui/adapters_section_test.dart
      - name: flutter test / ui/app_name_test.dart
