org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Added 2026-11-26. The incremental cache under build/<plugin>/kotlin kept failing to close --
# "Could not close incremental caches ... class-fq-name-to-source.tab, source-to-classes.tab,
# internal-name-to-source.tab" -- which reads as a compiler bug and behaves like a file-handle one.
# These builds are full builds every time, so the cache buys nothing here and its failure costs
# sixteen minutes per attempt.
kotlin.incremental=false
